<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso CRM | Mónica Bienes Raíces</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex flex-col justify-center items-center p-6">
    
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-10 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-50 rounded-full blur-2xl -mr-10 -mt-10"></div>
        
        <div class="text-center mb-8 relative z-10">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white mx-auto mb-4 shadow-lg shadow-indigo-200">
                <i class="fa-solid fa-house-chimney text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">CRM Administrativo</h1>
            <p class="text-slate-500 text-sm mt-2">Acceso exclusivo para Mónica Bienes Raíces</p>
        </div>

        <!-- Formulario modificado para validación con JavaScript -->
        <form id="loginForm" class="space-y-5 relative z-10">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Usuario</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-user text-slate-400"></i>
                    </div>
                    <input type="text" id="username" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500" placeholder="monicaadmin" required>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-slate-400"></i>
                    </div>
                    <input type="password" id="password" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500" placeholder="••••••••" required>
                </div>
            </div>
            
            <p id="error-msg" class="text-red-500 text-xs font-semibold hidden text-center">Usuario o contraseña incorrectos.</p>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-colors shadow-lg shadow-indigo-200 mt-4">
                Iniciar Sesión
            </button>
        </form>
        
        <div class="mt-8 text-center text-xs text-slate-400 relative z-10">
            <a href="index.html" class="hover:text-indigo-600 transition flex items-center justify-center">
                <i class="fa-solid fa-arrow-left mr-1"></i> Volver a la página pública
            </a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página recargue
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            // Validación exacta
            if(user === 'monicaadmin' && pass === 'INGMONICAM2026') {
                window.location.href = 'admin.html';
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
